<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#body)"/>

  <!-- Stacked container layers. -->
  <g fill="#ffffff">
    <rect x="30" y="38" width="30" height="22" rx="4"/>
    <rect x="66" y="38" width="30" height="22" rx="4"/>
    <rect x="30" y="66" width="30" height="22" rx="4" fill-opacity="0.75"/>
    <rect x="66" y="66" width="30" height="22" rx="4" fill-opacity="0.75"/>
  </g>

  <!-- The waterline the stack sits on. -->
  <rect x="24" y="96" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.55"/>
</svg>
