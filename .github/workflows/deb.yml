name: Debian package

# Builds the .deb on every push and pull request, and attaches it to a GitHub
# release when a v* tag is pushed. GitHub has no APT repository service, so the
# release asset is the distribution channel: `apt install ./lave-station_*.deb`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    # GTK 4.14 and libadwaita 1.5 are the build floor, so build on the oldest
    # distribution that carries them — which is also the package's target.
    container: debian:trixie
    permissions:
      contents: write

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-bin

      - uses: actions/checkout@v4

      # actions/checkout leaves a tree dpkg-parsechangelog and git see as
      # foreign-owned inside the container.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # Restored before rustup runs, so its shims are never overwritten by a
          # stale cached copy.
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-trixie-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-trixie-cargo-

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # CLAUDE.md: passing tests are a prerequisite for shipping anything.
      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install cargo-deb
        # The cache restores ~/.cargo/bin but not cargo's install ledger in
        # ~/.cargo/.crates.toml, so a plain `cargo install` on a warm cache sees an
        # unrecorded binary in the way and aborts. Reuse the cached one instead.
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked --version '^3'

      - name: Build package
        run: cargo deb -p lave

      - name: Name the package
        id: deb
        run: echo "path=$(ls target/debian/*.deb)" >> "$GITHUB_OUTPUT"

      - name: Verify the package installs
        run: |
          apt-get install -y --no-install-recommends "./${{ steps.deb.outputs.path }}"
          test -x /usr/bin/lave
          # The libglib2.0-0t64 trigger should have folded the schema into the cache.
          gsettings list-schemas | grep -qx com.paperstack.LaveStation

      - uses: actions/upload-artifact@v4
        with:
          name: lave-station-deb
          path: target/debian/*.deb

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          generate_release_notes: true
